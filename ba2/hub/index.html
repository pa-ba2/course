<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Analytics 2 — Course Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFBF7; --paper-2:#F4F0E6; --paper-3:#EDE7D9; --ink:#1C2B3A;
    --ink-soft:#55606E; --ink-faint:#8A93A0; --rule:#DED6C4;
    --teal:#0E6F7E; --teal-bg:#E3F1F3; --lav:#6B4C9A; --lav-bg:#EFE9F7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
  }
  main{max-width:840px; margin:0 auto; padding:56px 24px 80px;}
  header{margin-bottom:40px;}
  .kicker{color:var(--teal); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:.8rem;}
  h1{font-size:2rem; margin:.4em 0 .2em;}
  p.lede{color:var(--ink-soft); font-size:1.05rem; max-width:60ch;}
  ul.weeks{list-style:none; margin:0; padding:0; display:grid; gap:12px;}
  li.week{
    border:1px solid var(--rule); background:var(--paper-2); border-radius:10px;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  li.week a{color:var(--ink); text-decoration:none; font-weight:600;}
  li.week a:hover{color:var(--teal);}
  .badge{
    font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 9px; border-radius:999px; background:var(--lav-bg); color:var(--lav); white-space:nowrap;
  }
  .empty{color:var(--ink-faint); font-style:italic; padding:24px 0;}
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">Business Analytics 2</div>
    <h1>Course Hub</h1>
    <p class="lede">Live cohort sessions, advanced &amp; AI-augmented analytics. Weeks appear here as they're published.</p>
  </header>
  <ul class="weeks" id="weekList"></ul>
  <p class="empty" id="emptyMsg" hidden>No weeks published yet — check back soon.</p>
</main>
<script src="../manifest.js"></script>
<script>
  (function(){
    var data = window.BA2_MANIFEST || { weeks: [] };
    var list = document.getElementById('weekList');
    var published = data.weeks.filter(function(w){ return w.published; });
    if(!published.length){
      document.getElementById('emptyMsg').hidden = false;
      return;
    }
    published.forEach(function(w){
      var li = document.createElement('li');
      li.className = 'week';
      li.innerHTML =
        '<a href="../study-guides/' + w.id + '/index.html">' + w.title + '</a>' +
        '<span class="badge">' + w.id.replace('-', ' ') + '</span>';
      list.appendChild(li);
    });
  })();
</script>
</body>
</html>
